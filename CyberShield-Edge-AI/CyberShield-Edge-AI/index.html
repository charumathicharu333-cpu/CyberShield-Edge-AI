let replayTimer=null,searchTimer=null;
const pageMap={dashboard,monitor,detection,dna,story,replay,twin,heatmap,privacy,edge,response,evidence,assistant,reports,settings};
const shell=()=>{const body=(pageMap[state.page]||dashboard)();return `<div class="shell"><aside class="sidebar ${state.sidebar?'open':''}"><div class="brand"><div class="brand-mark">⌁</div><div><strong>CyberShield <span style="display:inline;color:var(--cyan);font-size:inherit;letter-spacing:0">Edge AI</span></strong><span>LOCAL AI CYBERSECURITY</span></div></div><div class="pill"><i class="dot"></i>LOCAL AI ACTIVE</div><nav class="nav"><div class="nav-label">SECURITY CONSOLE</div>${navItems.slice(0,8).map(x=>`<button class="${state.page===x[0]?'active':''}" data-action="nav" data-page="${x[0]}"><span class="nav-icon">${x[1]}</span>${x[2]}${x[0]==='monitor'?'<small>'+state.events.length+'</small>':''}</button>`).join('')}<div class="nav-label">TRUST & RESPONSE</div>${navItems.slice(8).map(x=>`<button class="${state.page===x[0]?'active':''}" data-action="nav" data-page="${x[0]}"><span class="nav-icon">${x[1]}</span>${x[2]}</button>`).join('')}</nav><div class="side-foot"><b><i class="dot"></i> Privacy boundary clear</b><p>Demo telemetry only. External AI APIs and system connectors are disabled.</p></div></aside><main class="main"><header class="topbar"><div class="crumb"><button class="icon-btn" data-action="menu" style="display:none;margin-right:8px">☰</button><b>CyberShield Edge AI</b> <span> / ${navItems.find(x=>x[0]===state.page)?.[2]||'Dashboard'}</span></div><div class="top-actions"><span class="edge-status"><i class="dot"></i>LOCAL AI ACTIVE</span><span class="demo-badge">DEMO MODE · SAMPLE DATA</span></div></header><section class="content">${body}</section></main></div>`};
const render=()=>{document.getElementById('app').innerHTML=shell();document.querySelector('.topbar .icon-btn').style.display=window.innerWidth<761?'inline-block':'none'};
const openEvent=id=>{state.selected=id;state.page='detection';save();render()};
const showModal=id=>{const e=byId(id);document.getElementById('modal-root').innerHTML=`<div class="modal-back" data-action="close-modal"><section class="modal"><div class="modal-head"><div><div class="eyebrow">EVENT DETAIL · ${e.id}</div><h2 style="margin:5px 0 0;color:#fff;font-size:16px">${esc(e.type)}</h2></div><button class="close" data-action="close-modal">×</button></div><div class="modal-body"><div class="row space">${badge(e.severity)}<span class="tag">${esc(e.component)}</span></div><p class="muted" style="margin-top:17px">${esc(e.description)}</p><div class="status-line"><span>Timestamp</span><b>${e.time}</b></div><div class="status-line"><span>Source</span><b>${esc(e.source)}</b></div><div class="status-line"><span>Scenario</span><b>${esc(e.scenario)}</b></div><div class="status-line"><span>Risk level</span><b style="color:var(--red)">${riskLevel(e)}</b></div><div class="actions" style="margin-top:18px"><button class="primary" data-action="select-and-evidence" data-id="${e.id}">Preserve evidence</button><button class="secondary" data-action="close-modal">Close</button></div></div></section></div>`};
const download=(name,content,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
const reportPayload=()=>({incidentId:'CS-DEMO-001',generatedAt:new Date().toISOString(),dataMode:'DEMO / SAMPLE DATA',privacy:{localProcessing:true,cloudUploadPercent:0,systemConnector:false},threat:{name:'Suspicious Activity Chain',severity:'HIGH',riskLevel:'HIGH',explanation:'Correlated login, process, file, and network events may represent suspicious activity.'},timeline:chain.map(e=>({id:e.id,time:e.time,type:e.type,source:e.source,severity:e.severity,description:e.description})),attackChain:chain.map(e=>e.type),evidence:state.evidence,recommendedActions:['Review suspicious process','Inspect network connection','Preserve evidence','Review affected files','Continue monitoring'],notes:state.notes});
const exportReport=format=>{const p=reportPayload();if(format==='json')download('cybershield-incident-report.json',JSON.stringify(p,null,2),'application/json');else{const html=`<!doctype html><meta charset="utf-8"><title>CyberShield Incident Report</title><style>body{font-family:Arial;color:#17263a;max-width:850px;margin:40px auto;line-height:1.5}h1{color:#087f9b}.box{border:1px solid #c9d8df;padding:16px;border-radius:8px;margin:15px 0}li{margin:7px 0}</style><h1>CyberShield Edge AI Incident Report</h1><p><b>Incident:</b> ${p.incidentId} · <b>Mode:</b> ${p.dataMode}</p><div class="box"><h2>Threat summary</h2><p>${p.threat.explanation}</p><p><b>Severity:</b> ${p.threat.severity}</p></div><div class="box"><h2>Timeline</h2><ul>${p.timeline.map(x=>`<li><b>${x.time} · ${x.type}</b> · ${x.description}</li>`).join('')}</ul></div><div class="box"><h2>Attack chain</h2><p>${p.attackChain.join(' → ')}</p></div><div class="box"><h2>Recommended actions</h2><ul>${p.recommendedActions.map(x=>`<li>${x}</li>`).join('')}</ul></div><p>Privacy: 100% local processing in this demo. No external AI API was used.</p>`;download('cybershield-incident-report.html',html,'text/html')}toast('Report downloaded locally.')};
const addEvidence=async()=>{const e=byId(state.selected);if(state.evidence.some(x=>x.sourceId===e.id)){toast('This event is already preserved.');nav('evidence');return}const raw=JSON.stringify({id:e.id,time:e.time,type:e.type,source:e.source,description:e.description});let hash='UNAVAILABLE';try{const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));hash=[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{}state.evidence.push({id:`EV-${String(state.evidence.length+1).padStart(3,'0')}`,sourceId:e.id,type:e.type,time:e.time,hash});save();toast('Evidence preserved with a local SHA-256 hash.');nav('evidence')};
const assistantAnswer=q=>{const s=q.toLowerCase();if(s.includes('why')||s.includes('suspicious'))return 'The chain is suspicious because different event types occur close together: a login, an unsigned process, sensitive file access, and an unfamiliar network connection. The rule engine flags correlation, not certainty.';if(s.includes('what happened')||s.includes('story'))return 'In the sample story, a login was followed by a new process, file access, and an outbound network connection. Open Threat Story to read the human-friendly version.';if(s.includes('check')||s.includes('next'))return 'Review the process signature, confirm the user action, inspect the network destination, and preserve evidence before changing device state.';if(s.includes('related')||s.includes('event'))return `Related records are ${chain.map(e=>e.id).join(', ')}. They belong to the ${chain[0].scenario} demo scenario.`;if(s.includes('privacy'))return 'This preview uses local sample data, sends 0% to cloud services, and does not access your operating system.';return 'I can explain the suspicious chain, summarize what happened, show related events, suggest what to check, or explain the privacy boundary.'};
const ask=q=>{if(!q.trim())return;state.assistant.push({role:'user',text:q.trim()},{role:'bot',text:assistantAnswer(q)});save();render()};
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='nav')nav(el.dataset.page);if(a==='menu'){state.sidebar=!state.sidebar;render()}if(a==='event')showModal(el.dataset.id);if(a==='close-modal')document.getElementById('modal-root').innerHTML='';if(a==='select-and-evidence'){state.selected=el.dataset.id;document.getElementById('modal-root').innerHTML='';addEvidence()}if(a==='filter'){state.filter=el.dataset.filter;save();render()}if(a==='search'){state.search=el.value;save();render()}if(a==='story'){state.storyScenario=el.dataset.scenario;save();render()}if(a==='replay-control'){const c=el.dataset.control;if(c==='restart')state.replay=0;if(c==='prev')state.replay=Math.max(0,state.replay-1);if(c==='next')state.replay=Math.min(chain.length-1,state.replay+1);if(c==='play'){state.replaying=true;clearInterval(replayTimer);replayTimer=setInterval(()=>{state.replay=state.replay>=chain.length-1?0:state.replay+1;render()},1200)}if(c!=='play')clearInterval(replayTimer);save();render()}if(a==='evidence')addEvidence();if(a==='plan'){const i=+el.dataset.index;state.planDone=state.planDone||[];state.planDone=state.planDone.includes(i)?state.planDone.filter(x=>x!==i):[...state.planDone,i];save();render()}if(a==='save-note'){const v=document.getElementById('response-note')?.value.trim();if(v){state.notes.push({time:new Date().toISOString(),text:v});save();toast('Analyst note saved locally.')}}if(a==='export')exportReport(el.dataset.format);if(a==='reset-all'){if(confirm('Reset local demo workspace and evidence?')){localStorage.removeItem('cybershield_edge_state');location.reload()}}if(a==='reset-data'){state.filter='ALL';state.search='';save();render()}});
document.addEventListener('input',e=>{if(e.target.dataset.action==='search'){state.search=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{save();render()},250)}});
document.addEventListener('submit',e=>{if(e.target.dataset.action==='ask'){e.preventDefault();ask(new FormData(e.target).get('question')||'')}});
window.addEventListener('resize',()=>{const b=document.querySelector('.topbar .icon-btn');if(b)b.style.display=window.innerWidth<761?'inline-block':'none'});
render();
</script>
</body>
</html>
</script>
